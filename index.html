<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>選擇要開啟的連接</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            text-align: center;
        }

        h1 {
            margin: 0 0 30px;
            font-size: 28px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        button {
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #555;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* 一鍵開啟全部按鈕 */
        .all-button {
            width: 100%;
            margin-bottom: 20px;
            background: #2563eb;
            font-size: 18px;
            font-weight: bold;
        }

        .all-button:hover {
            background: #1d4ed8;
        }

    </style>
</head>

<body>

    <h1>選擇要開啟的連接</h1>


    <!-- 一鍵開啟全部 -->
    <div class="button-container">

        <button class="all-button" onclick="openAllLinks()">
            🚀 一鍵開啟全部
        </button>

    </div>


    <!-- 個別網站按鈕 -->
    <div class="button-container">

        <button onclick="openLink('https://me.wegosm666.com/#/login?redirect=%2Fdashboard')">
            GOSM
        </button>

        <button onclick="openLink('https://pay.drmpro.net/')">
            DMP
        </button>

        <button onclick="openLink('https://mer.llspayment.com/mer/')">
            HAPPY
        </button>

        <button onclick="openLink('https://merchant.cgpay.io')">
            cgpay
        </button>

        <button onclick="openLink('https://b2b.twwalletb2bmanagerab.com')">
            EB
        </button>

           <button onclick="openLink('https://dev.gppay.asia/#/signin/fd36c515-0a31-43aa-88e5-c065aa2d232a')">
            GO
        </button>

        <button onclick="openLink('https://time.is/zh/')">
            TIME.IS
        </button>

    </div>


    <script>

        // 所有要開啟的網址
        const links = [
            'https://me.wegosm666.com/#/login?redirect=%2Fdashboard',
            'https://pay.drmpro.net/',
            'https://mer.llspayment.com/mer/',
            'https://dev.gppay.asia/#/signin/fd36c515-0a31-43aa-88e5-c065aa2d232a',
             'https://merchant.cgpay.io',
             'https://b2b.twwalletb2bmanagerab.com',
            'https://time.is/zh/'
        ];


        // 開啟單一網址
        function openLink(url) {
            window.open(url, '_blank');
        }


        // 一鍵開啟全部網址
        function openAllLinks() {

            links.forEach(function(url) {
                window.open(url, '_blank');
            });

        }

    </script>

</body>
</html>
