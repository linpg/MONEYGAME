<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WK - 一鍵開啟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        /* 一鍵全開按鈕的樣式，設為藍色以示區別 */
        .open-all-btn {
            background-color: #007BFF;
            color: white;
            border: none;
            font-weight: bold;
            padding: 15px 30px;
            display: block;
            margin: 20px auto;
        }
        .open-all-btn:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        function openAllLinks() {
            // 定義所有要開啟的網址
            const urls = [
                'https://alpaystar.com/dashboard', // D
                 'https://a.xxfaa.com/#/transaction/daiso', // 泰
                 'https://www.123bet10bo.com/', // 菲P
                'https://www.123bet3bo.com/', // 菲R
            ];

            // 遍歷網址並開啟
            urls.forEach(url => {
                window.open(url, '_blank');
            });
        }
    </script>
</head>
<body>
    <h1>選擇要開啟的連接</h1>

    <button class="open-all-btn" onclick="openAllLinks()">🏦 一鍵開啟</button>
    
    <hr style="width: 50%; margin: 20px auto;">

     <button onclick="window.open('https://alpaystar.com/dashboard')">D</button>
     <button onclick="window.open('https://a.xxfaa.com/#/transaction/daiso')">泰</button>
     <button onclick="window.open('https://www.123bet10bo.com/')">菲P</button>
    <button onclick="window.open('https://www.123bet3bo.com/')">菲R</button>
</body>
</html>
